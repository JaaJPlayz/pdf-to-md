[project]
name = "pdf-to-md"
version = "0.1.0"
description = "Convert PDF documents to Markdown using pymupdf"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pymupdf>=1.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
pdf2md = "pdf_to_md.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring model downloads (deselect with '-m \"not integration\"')",
]
